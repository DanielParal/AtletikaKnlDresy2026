<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Manual with Images</title>
  <style>
    /* Reset some default styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: #f8f8f8;
      color: #333;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
      color: green;
    }

    ol {
      margin-bottom: 30px;
      padding-left: 20px;
      max-width: 500px;
    }

    ol li {
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .images {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 500px;
    }

    .images img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>Atletika Kamenice nad Lipou - Katalog dresů 2026</h1>
  <ol>
    <li>Step 1: Do this first.</li>
    <li>Step 2: Then do this.</li>
    <li>Step 3: Continue with this step.</li>
    <li>Step 4: Almost done, do this.</li>
    <li>Step 5: Finish by doing this last step.</li>
  </ol>

  <div class="images">
    <img src="./Dresy.png" alt="Dresy katalog">
    <img src="./QrKodNaPlatbu.png" alt="QrKodNaPlatbu">
  </div>
</body>
</html>
